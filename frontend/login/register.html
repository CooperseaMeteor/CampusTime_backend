<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园食光 - 注册</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #fff5eb, #f8f9fa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* 注册卡片样式 */
        .register-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }
        
        /* Logo和标题 */
        .logo {
            font-size: 32px;
            color: #FF6B35;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        /* 表单样式 */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            border-color: #FF6B35;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }
        /* 新增：学院禁用样式（灰色背景+禁止光标，不突兀） */
        .form-control:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }
        
        /* 按钮样式 */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: #FF6B35;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #e55a2a;
        }
        
        /* 底部链接 */
        .login-link {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
        
        .login-link a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: bold;
        }

        /* 学校搜索联想框样式优化 */
        #schoolSuggest::-webkit-scrollbar {
            width: 6px;
        }
        #schoolSuggest::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }
        #schoolSuggest::-webkit-scrollbar-thumb:hover {
            background: #FF6B35;
        }
        /* 学校选项hover效果增强 */
        .school-item {
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .school-item:hover {
            background-color: #fff5eb;
            color: #FF6B35;
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            .register-container {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>
    <script src="/config.js"></script>
    <script src="/router.js"></script>
</head>
<body>
    <div class="register-container">
        <div class="logo">🍽️</div>
        <h1 class="title">校园食光</h1>
        <p class="subtitle">发现校园里的每一处美食</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" class="form-control" placeholder="请输入密码(至少6位)" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入密码" required>
            </div>

            <!-- 学校：保留你原有样式+逻辑，默认展开全量列表+搜索筛选 -->
            <div class="form-group" style="position: relative;">
                <label for="schoolInput">学校</label>
                <input type="text" id="schoolInput" class="form-control" placeholder="输入学校名称筛选（如：深圳、技术大学）" required>
                <div id="schoolSuggest" style="position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; box-shadow: 0 3px 10px rgba(255,107,53,0.1); z-index: 999; max-height: 250px; overflow-y: auto; display: block;">
                    <div style="padding: 10px; color: #999; text-align: center;">加载中... 请稍候</div>
                </div>
                <input type="hidden" id="school" name="school" required>
            </div>
            
            <!-- 普通用户信息字段：仅修改学院框，默认禁用+提示请先选学校 -->
            <div id="userFields">
                <div class="form-group">
                    <label for="realName">真实姓名</label>
                    <input type="text" id="realName" class="form-control" placeholder="请输入真实姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="studentId">学号</label>
                    <input type="text" id="studentId" class="form-control" placeholder="请输入学号" required>
                </div>
                
                <!-- 学院：修改为默认禁用，仅下拉选择，无手动输入 -->
                <div class="form-group">
                    <label for="college">学院</label>
                    <select id="college" class="form-control" required disabled>
                        <option value="">请先选择学校</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="major">专业</label>
                    <input type="text" id="major" class="form-control" placeholder="请输入专业" required>
                </div>
                
                <div class="form-group">
                    <label for="grade">年级</label>
                    <select id="grade" class="form-control" required>
                        <option value="">请选择年级</option>
                        <option value="大一">大一</option>
                        <option value="大二">大二</option>
                        <option value="大三">大三</option>
                        <option value="大四">大四</option>
                        <option value="研一">研一</option>
                        <option value="研二">研二</option>
                        <option value="研三">研三</option>
                        <option value="博一">博一</option>
                        <option value="博二">博二</option>
                        <option value="博三">博三</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="tel" id="phone" class="form-control" placeholder="请输入手机号" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">立即注册</button>
        </form>
        
        <div class="login-link">
            已有账号？<a href="javascript:void(0)" onclick="Router.toUserLogin()">立即登录</a>
        </div>
    </div>

    <script>
        // ======================================
        // 新增：学校-学院官方映射表（核心！你可自行扩展/修改，按官方信息加）
        // ======================================
        const SCHOOL_COLLEGE_OFFICIAL = {
            "深圳技术大学": ["计算机科学与技术学院", "电信工程与智能化学院", "生态环境与建筑工程学院", "马克思主义学院", "研究生院", "卓越工程师学院", "经管学院", "外国语学院", "教育学院"],
            "深圳大学": ["计算机与软件学院", "电子与信息工程学院", "建筑与城市规划学院", "经济学院", "管理学院", "外国语学院", "法学院", "马克思主义学院"],
            "华南理工大学": ["计算机科学与工程学院", "电子与信息学院", "土木与交通学院", "工商管理学院", "经济与金融学院", "外国语学院"],
            "广东工业大学": ["计算机学院", "电子信息学院", "建筑与环境学院", "管理学院", "经济学院", "马克思主义学院"],
            "北京大学": ["信息科学技术学院", "经济学院", "光华管理学院", "外国语学院", "法学院", "马克思主义学院"],
            "清华大学": ["计算机系", "电子工程系", "建筑学院", "经济管理学院", "人文学院", "外国语学院"],
            "中山大学": ["计算机学院", "电子与信息工程学院", "建筑学院", "岭南学院", "管理学院", "外国语学院"],
            "哈尔滨工业大学（深圳）": ["计算机科学与技术学院", "电子与信息工程学院", "土木与环境工程学院", "经济管理学院"],
            "东莞理工学院": ["计算机科学与技术学院", "电信工程与智能化学院", "生态环境与建筑工程学院", "马克思主义学院", "研究生院","卓越工程师学院","经管学院","外国语学院","教育学院"]
        };

        // ======================================
        // 保留你原有代码：全局DOM变量（仅新增collegeSelect）
        // ======================================
        const schoolInput = document.getElementById('schoolInput');
        const schoolSuggest = document.getElementById('schoolSuggest');
        const schoolHidden = document.getElementById('school');
        const collegeSelect = document.getElementById('college'); // 新增：获取学院框DOM
        let allSchools = []; // 存储全量学校

        // ======================================
        // 保留你原有代码：加载全量学校数据源（3000+学校，无修改）
        // ======================================
        async function loadAllSchools() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/chenjiandongx/university-list/master/universities.json');
                if (!res.ok) throw new Error('数据源请求失败');
                const data = await res.json();
                allSchools = [...new Set(data.map(school => school.name))]
                    .sort((a, b) => a.localeCompare(b, 'zh-CN'));
                renderSchoolList(allSchools);
            } catch (err) {
                console.error('学校数据源加载失败:', err);
                const fallbackSchools = [
                    "北京大学", "清华大学", "浙江大学", "上海交通大学", "复旦大学",
                    "南京大学", "中国科学技术大学", "哈尔滨工业大学", "西安交通大学", "中山大学",
                    "武汉大学", "华中科技大学", "东南大学", "南开大学", "天津大学",
                    "四川大学", "吉林大学", "山东大学", "厦门大学", "北京航空航天大学",
                    "北京理工大学", "同济大学", "华南理工大学", "大连理工大学", "西北工业大学",
                    "重庆大学", "电子科技大学", "兰州大学", "华南师范大学", "深圳技术大学",
                    "深圳大学", "南方科技大学", "哈尔滨工业大学（深圳）", "暨南大学", "广东工业大学",
                    "广州大学", "华南农业大学", "广东外语外贸大学", "汕头大学", "广州医科大学",
                    "广东药科大学", "东莞理工学院", "佛山科学技术学院", "韶关学院", "惠州学院"
                ];
                allSchools = fallbackSchools.sort((a, b) => a.localeCompare(b, 'zh-CN'));
                renderSchoolList(allSchools);
            }
        }

        function renderSchoolList(schools) {
            if (schools.length === 0) {
                schoolSuggest.innerHTML = '<div style="padding: 10px; color: #777; text-align: center;">暂无匹配学校</div>';
                return;
            }
            schoolSuggest.innerHTML = schools.map(school => 
                `<div class="school-item">${school}</div>`
            ).join('');
            bindSchoolSelectEvent();
        }

        // ======================================
        // 修改：学校选中逻辑（仅新增加载学院的代码）
        // ======================================
        function bindSchoolSelectEvent() {
            schoolSuggest.querySelectorAll('.school-item').forEach(item => {
                item.addEventListener('click', function() {
                    const selectedSchool = this.textContent;
                    schoolInput.value = selectedSchool;
                    schoolHidden.value = selectedSchool;
                    schoolSuggest.style.display = 'block';
                    
                    // 新增：选中学校后，加载对应官方学院
                    loadCollegeBySchool(selectedSchool);
                });
            });
        }

        // ======================================
        // 新增：根据学校加载对应学院（极简逻辑）
        // ======================================
        function loadCollegeBySchool(schoolName) {
            // 清空学院原有选项
            collegeSelect.innerHTML = '<option value="">请选择学院</option>';
            // 启用学院下拉框
            collegeSelect.disabled = false;
            // 获取官方学院列表，无则提示
            const colleges = SCHOOL_COLLEGE_OFFICIAL[schoolName] || [];
            if (colleges.length === 0) {
                collegeSelect.innerHTML = '<option value="">该学校暂无官方学院数据</option>';
                return;
            }
            // 填充学院选项
            colleges.forEach(college => {
                const opt = document.createElement('option');
                opt.value = college;
                opt.textContent = college;
                collegeSelect.appendChild(opt);
            });
        }

        // ======================================
        // 修改：学校搜索输入逻辑（仅新增重置学院的代码）
        // ======================================
        schoolInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (keyword === '') {
                renderSchoolList(allSchools);
                // 新增：清空学校时，重置学院为禁用状态
                collegeSelect.innerHTML = '<option value="">请先选择学校</option>';
                collegeSelect.disabled = true;
                schoolHidden.value = '';
                return;
            }
            const filteredSchools = allSchools.filter(school => 
                school.toLowerCase().includes(keyword)
            );
            renderSchoolList(filteredSchools);
        });


        document.addEventListener('click', function(e) {
            if (!schoolInput.contains(e.target) && !schoolSuggest.contains(e.target)) {
                schoolSuggest.style.display = 'none';
            } else {
                schoolSuggest.style.display = 'block';
            }
        });

        window.onload = loadAllSchools;

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const selectedSchool = document.getElementById('school').value;
            const selectedCollege = document.getElementById('college').value; // 新增：获取学院值
            
            // 原有密码校验
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致！');
                return;
            }
            if (password.length < 6) {
                alert('密码至少需要6位字符！');
                return;
            }
            // 原有学校校验
            if (!selectedSchool) {
                alert('请从列表中选择您的学校！');
                return;
            }
            // 新增：学院选中校验
            if (!selectedCollege) {
                alert('请选择您的学院！');
                return;
            }

            // 组装注册数据（保留你原有字段）
            const registerData = {
                username,
                password,
                school: selectedSchool,
                realName: document.getElementById('realName').value,
                studentId: document.getElementById('studentId').value,
                college: selectedCollege,
                major: document.getElementById('major').value,
                grade: document.getElementById('grade').value,
                phone: document.getElementById('phone').value
            };
            
            // 保留你原有提交逻辑
            try {
                const data = await Router.apiCall(API_ENDPOINTS.REGISTER, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData)
                });
                
                if (data && data.code === 200) {
                    alert('注册成功！即将跳转到登录页面');
                    Router.toUserLogin();
                } else {
                    alert('注册失败：' + ((data && data.message) || '未知错误'));
                }
            } catch (error) {
                console.error('注册请求失败:', error);
                alert('注册失败，请检查网络连接或稍后重试');
            }
        });
    </script>
</body>
</html>
