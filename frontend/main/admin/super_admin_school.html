    <style>
        :root {
            --primary-color: #e60012;
            --bg-gray: #f8f8f8;
            --border-color: #e5e5e5;
            --text-dark: #333;
            --text-light: #999;
            /* 状态颜色 */
            --status-active: #52c41a;
            --status-disabled: #fa8c16;
            --status-pending: #1890ff;
            --spacing-small: 8px;
            --spacing-medium: 15px;
            --spacing-large: 20px;
            --border-radius: 4px;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            line-height: 1.5;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-large);
        }
        .page-header {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-title {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .page-title i {
            margin-right: 10px;
            color: var(--primary-color);
        }
        .page-subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 5px;
        }
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(230, 0, 18, 0.15);
        }
        .action-btn:hover {
            background-color: #cc0010;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(230, 0, 18, 0.25);
        }
        .filter-section {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-card);
            padding: var(--spacing-medium);
            margin-bottom: var(--spacing-large);
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-medium);
            align-items: center;
        }
        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }
        .search-input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 14px;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-small);
        }
        .filter-label {
            font-size: 14px;
            color: var(--text-dark);
            margin-right: var(--spacing-small);
        }
        .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            min-width: 120px;
        }
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--spacing-large);
            margin-bottom: var(--spacing-large);
        }
        .school-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: transform 0.3s;
        }
        .school-card:hover {
            transform: translateY(-5px);
        }
        .school-header {
            position: relative;
            height: 160px;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-light);
        }
        .school-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            min-width: 100px;
            text-align: center;
        }
        .school-status:hover {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }
        .status-active { background-color: var(--status-active); }
        .status-disabled { background-color: var(--status-disabled); }
        .status-pending { background-color: var(--status-pending); }
        .school-body {
            padding: var(--spacing-medium);
        }
        .school-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .school-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            color: var(--text-light);
            font-size: 14px;
        }
        .school-meta i {
            width: 16px;
            color: var(--primary-color);
            margin-right: 8px;
        }
        .school-actions {
            display: flex;
            gap: var(--spacing-small);
        }
        .action-btn-small {
            padding: 10px 18px;
            font-size: 14px;
            flex: 1;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(230, 0, 18, 0.1);
        }
        .action-btn-small:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(230, 0, 18, 0.15);
        }
        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-medium);
            border-bottom: 1px solid var(--border-color);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }
        .modal-body {
            padding: var(--spacing-large);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .footer {
            text-align: center;
            padding: 20px 0;
            color: var(--text-light);
            font-size: 13px;
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .filter-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-box {
                min-width: 100%;
            }
            .schools-grid {
                grid-template-columns: 1fr;
            }
            /* 响应式状态按键 */
            .school-status {
                padding: 8px 16px;
                font-size: 14px;
                top: 16px;
                right: 16px;
                min-width: 90px;
            }
            /* 响应式操作按钮 */
            .action-btn {
                padding: 10px 20px;
                font-size: 13px;
            }
            .action-btn-small {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>

        let allSchools = [];

        function renderProvinceOptions(selectId, defaultValue = "") {
            const select = document.getElementById(selectId);
            if (!select) return;
            select.innerHTML = `<option value="">${selectId.includes('add') || selectId.includes('edit') ? '请选择省份' : '全部省份'}</option>`;
            Object.entries(provinceMap).forEach(([pinyin, name]) => {
                const option = document.createElement('option');
                option.value = pinyin;
                option.textContent = name;
                if (pinyin === defaultValue) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        function loadCitiesByProvince(provincePinyin, targetCitySelectId, defaultValue = "") {
            const citySelect = document.getElementById(targetCitySelectId);
            if (!citySelect) return;
            citySelect.innerHTML = `<option value="">${targetCitySelectId.includes('add') || targetCitySelectId.includes('edit') ? '请选择城市' : '全部城市'}</option>`;
            if (provincePinyin && areaData[provincePinyin]) {
                areaData[provincePinyin].forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    if (city === defaultValue) {
                        option.selected = true;
                    }
                    citySelect.appendChild(option);
                });
            }
        }

        // 页面初始化（原有逻辑，无修改）
        document.addEventListener('DOMContentLoaded', function() {
            renderProvinceOptions('provinceFilter');
            renderProvinceOptions('addProvince');
            renderProvinceOptions('editProvince');
            loadSchoolsData();
        });

        // 加载学校数据（原有逻辑，无修改）
        function loadSchoolsData() {
            fetch(`${CONFIG.API_BASE_URL}/schools`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
            })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    allSchools = result.data.schools || [];
                    renderSchoolsGrid(allSchools);
                } else throw new Error(result.message);
            })
            .catch(err => {
                document.getElementById('schoolsGrid').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-light);">
                        <i class="fas fa-exclamation-circle" style="font-size: 24px; color: var(--status-disabled); margin-bottom: 10px;"></i>
                        <p>${err.message}</p>
                        <button class="action-btn" onclick="loadSchoolsData()" style="margin-top: 10px;">重新加载</button>
                    </div>
                `;
            });
        }

        // 渲染学校列表（修复HTML标签，无功能逻辑修改）
        function renderSchoolsGrid(schools) {
            if (schools.length === 0) {
                document.getElementById('schoolsGrid').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-light);">
                        <i class="fas fa-folder-open" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>暂无符合条件的学校数据</p>
                    </div>
                `;
                return;
            }

            const html = schools.map(school => {
                // 状态显示（原有逻辑，无修改）
                let statusClass = '', statusText = '';
                if (school.status === 'active') { statusClass = 'status-active'; statusText = '已开放'; }
                else if (school.status === 'disabled') { statusClass = 'status-disabled'; statusText = '未开放'; }
                else { statusClass = 'status-pending'; statusText = '待审核'; }

                // 地区显示（适配新的省市数据，无逻辑修改）
                const provinceText = school.province ? (provinceMap[school.province] || '省份待完善') : '省份待完善';
                const cityText = school.city || '城市待完善';

                return `
                    <div class="school-card">
                        <div class="school-header">
                            <i class="fas fa-university"></i>
                            <div class="school-status ${statusClass}" onclick="toggleSchoolStatus(${school.id}, '${school.status}')">
                                ${statusText}
                            </div>
                        </div>
                        <div class="school-body">
                            <div class="school-name">${school.name}</div>
                            <div class="school-meta">
                                <div><i class="fas fa-map-marker-alt"></i>${provinceText} ${cityText}</div>
                                <div><i class="fas fa-map"></i>${school.address || '地址待完善'}</div>
                                <div><i class="fas fa-phone"></i>${school.contact_phone}</div>
                                <div><i class="fas fa-calendar"></i>入驻时间: ${new Date(school.created_at).toLocaleDateString()}</div>
                            </div>
                            <div class="school-actions">
                                <button class="action-btn action-btn-small" onclick="openEditSchoolModal(${school.id})">
                                    <i class="fas fa-edit"></i> 编辑
                                </button>
                                <button class="action-btn action-btn-small" onclick="deleteSchool(${school.id})">
                                    <i class="fas fa-trash"></i> 删除
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('schoolsGrid').innerHTML = html;
        }

        // 点击状态标签切换学校状态（原有逻辑，无修改）
       // 修复后：完整的状态循环（待审核 → 已开放 → 未开放 → 待审核）
function toggleSchoolStatus(schoolId, currentStatus) {
            const newStatus = currentStatus === 'pending' ? 'active' : currentStatus === 'active' ? 'disabled' : 'pending';
            
            fetch(`${CONFIG.API_BASE_URL}/schools/${schoolId}/status`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    loadSchoolsData();
                } else throw new Error(result.message);
            })
            .catch(err => alert(err.message));
        }


        // 筛选用省市级联（原有逻辑，适配新的全国数据）
        function loadCities(province) {
            loadCitiesByProvince(province, 'cityFilter');
        }

        // 筛选功能（关键词+状态+省+市，原有逻辑，无修改）
        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const province = document.getElementById('provinceFilter').value;
            const city = document.getElementById('cityFilter').value;

            const filtered = allSchools.filter(school => {
                const matchKeyword = keyword === '' || 
                    (school.name && school.name.toLowerCase().includes(keyword)) || 
                    (school.address && school.address.toLowerCase().includes(keyword));
                const matchStatus = status === '' || school.status === status;
                const matchProvince = province === '' || school.province === province;
                const matchCity = city === '' || school.city === city;

                return matchKeyword && matchStatus && matchProvince && matchCity;
            });

            renderSchoolsGrid(filtered);
        }

        // 添加学校-省市级联（原有逻辑，适配新的全国数据）
        function loadAddCities(province) {
            loadCitiesByProvince(province, 'addCity');
        }

        // 编辑学校-省市级联（原有逻辑，适配新的全国数据）
        function loadEditCities(province) {
            loadCitiesByProvince(province, 'editCity');
        }

        // 添加学校相关方法（原有逻辑，地址非必填，无修改）
        function openAddSchoolModal() {
            document.getElementById('addSchoolForm').reset();
            document.getElementById('addSchoolModal').classList.add('show');
        }
        function closeAddSchoolModal() {
            document.getElementById('addSchoolModal').classList.remove('show');
        }
        function handleAddSchool(e) {
            e.preventDefault();
            const formData = {
                name: document.getElementById('addSchoolName').value.trim(),
                province: document.getElementById('addProvince').value,
                city: document.getElementById('addCity').value,
                address: document.getElementById('addAddress').value.trim() || '',
                contact_phone: document.getElementById('addPhone').value.trim()
            };
            fetch(`${CONFIG.API_BASE_URL}/schools`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert('添加成功');
                    closeAddSchoolModal();
                    loadSchoolsData();
                } else throw new Error(result.message);
            })
            .catch(err => alert(err.message));
        }

        // 编辑学校相关方法（原有逻辑，地址非必填，无修改）
        function openEditSchoolModal(schoolId) {
            fetch(`${CONFIG.API_BASE_URL}/schools/${schoolId}`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
            })
            .then(res => res.json())
            .then(result => {
                if (result.code !== 200) throw new Error(result.message);
                const school = result.data;
                document.getElementById('editSchoolId').value = school.id;
                document.getElementById('editSchoolName').value = school.name;
                renderProvinceOptions('editProvince', school.province);
                loadCitiesByProvince(school.province, 'editCity', school.city);
                document.getElementById('editAddress').value = school.address || '';
                document.getElementById('editPhone').value = school.contact_phone;
                document.getElementById('editSchoolModal').classList.add('show');
            })
            .catch(err => alert(err.message));
        }
        function closeEditSchoolModal() {
            document.getElementById('editSchoolModal').classList.remove('show');
        }
        function handleEditSchoolSubmit(e) {
            e.preventDefault();
            const schoolId = document.getElementById('editSchoolId').value;
            const formData = {
                name: document.getElementById('editSchoolName').value.trim(),
                province: document.getElementById('editProvince').value,
                city: document.getElementById('editCity').value,
                address: document.getElementById('editAddress').value.trim() || '',
                contact_phone: document.getElementById('editPhone').value.trim()
            };
            fetch(`${CONFIG.API_BASE_URL}/schools/${schoolId}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert('更新成功');
                    closeEditSchoolModal();
                    loadSchoolsData();
                } else throw new Error(result.message);
            })
            .catch(err => alert(err.message));
        }

        // 删除学校（原有逻辑，无修改）
        function deleteSchool(schoolId) {
            if (!confirm('确定删除该学校？')) return;
            fetch(`${CONFIG.API_BASE_URL}/schools/${schoolId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
            })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    loadSchoolsData();
                } else throw new Error(result.message);
            })
            .catch(err => alert(err.message));
        }
