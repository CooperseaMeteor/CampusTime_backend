<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户详情 - 校园食光</title>
    <script src="/config.js"></script>
    <script src="/router.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: #f8f9fa;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        
        /* 顶部返回栏 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }
        
        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: #FF6B35;
        }
        
        .page-title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        /* 商户信息区 */
        .merchant-header {
            margin-top: 50px;
            background: white;
            padding: 20px;
        }
        
        .merchant-banner {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        
        .merchant-info {
            margin-bottom: 15px;
        }
        
        .merchant-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .merchant-path {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }
        
        .merchant-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .tag {
            background: #fff5eb;
            color: #FF6B35;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
        }
        
        .merchant-stats {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #FF6B35;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #777;
        }
        
        /* 操作按钮区 */
        .action-buttons {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: white;
            margin-top: 10px;
        }
        
        .action-btn {
            flex: 1;
            margin: 0 5px;
            padding: 12px;
            border: 1px solid #FF6B35;
            border-radius: 8px;
            background: white;
            color: #FF6B35;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-btn.primary {
            background: #FF6B35;
            color: white;
        }
        
        .action-btn:hover {
            transform: scale(1.05);
        }
        
        /* Tab导航 */
        .tabs {
            display: flex;
            background: white;
            margin-top: 10px;
            padding: 0 15px;
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            font-size: 15px;
            color: #777;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #FF6B35;
            border-bottom-color: #FF6B35;
            font-weight: bold;
        }
        
        /* 档口列表 */
        .stall-list {
            padding: 15px;
        }
        
        .stall-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .stall-card:hover {
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.2);
            transform: translateY(-2px);
        }
        
        .stall-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: #fff5eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 15px;
        }
        
        .stall-info {
            flex: 1;
        }
        
        .stall-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stall-category {
            font-size: 13px;
            color: #777;
        }
        
        .stall-status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .stall-status.open {
            background: #d4edda;
            color: #155724;
        }
        
        .stall-status.closed {
            background: #f8d7da;
            color: #721c24;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 50px;
            color: #777;
        }
    </style>
</head>
<body>
    <!-- 顶部返回栏 -->
    <div class="top-bar">
        <span class="back-btn" onclick="history.back()">←</span>
        <div class="page-title">商户详情</div>
        <div style="width: 20px;"></div>
    </div>
    
    <!-- 商户信息区 -->
    <div class="merchant-header" id="merchantHeader">
        <div class="loading">加载中...</div>
    </div>
    
    <!-- 操作按钮 -->
    <div class="action-buttons">
        <button class="action-btn" onclick="handleWantToGo()">想去试试</button>
        <button class="action-btn primary" onclick="handleCheckin()">已打卡</button>
        <button class="action-btn" onclick="handleShare()">分享</button>
    </div>
    
    <!-- Tab导航 -->
    <div class="tabs">
        <div class="tab active" data-tab="all" onclick="switchTab('all')">全部</div>
        <div class="tab" data-tab="open" onclick="switchTab('open')">营业中</div>
        <div class="tab" data-tab="favorite" onclick="switchTab('favorite')">收藏</div>
    </div>
    
    <!-- 档口列表 -->
    <div class="stall-list" id="stallList">
        <div class="loading">加载中...</div>
    </div>

    <script>
        let currentTab = 'all';
        let merchantData = null;
        let stallsData = [];
        
        // 获取商户ID（从URL参数）
        const urlParams = new URLSearchParams(window.location.search);
        const merchantId = urlParams.get('id') || '1';
        
        // 页面加载时获取数据
        window.onload = function() {
            loadMerchantInfo();
            loadStalls();
        };
        
        // 加载商户信息
        async function loadMerchantInfo() {
            try {
                const resp = await Router.apiCall(API_ENDPOINTS.MERCHANT_DETAIL(merchantId));
                if (resp && resp.code === 200) {
                    const m = resp.data;
                    merchantData = {
                        id: m.id,
                        name: m.name,
                        path: m.location_path || '校区 · 食堂区域',
                        banner: m.banner_image || 'https://via.placeholder.com/400x200?text=食堂图片',
                        tags: Array.isArray(m.tags) ? m.tags : (m.tags ? JSON.parse(m.tags) : ['实惠','种类丰富']),
                        customerFlow: m.customer_flow || '适中',
                        rating: m.rating || 0,
                        reviews: m.review_count || 0
                    };
                }
                renderMerchantHeader();
            } catch (error) {
                console.error('加载商户信息失败:', error);
                document.getElementById('merchantHeader').innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }
        
        // 渲染商户头部
        function renderMerchantHeader() {
            const html = `
                <img src="${merchantData.banner}" alt="${merchantData.name}" class="merchant-banner">
                <div class="merchant-info">
                    <div class="merchant-name">${merchantData.name}</div>
                    <div class="merchant-path">📍 ${merchantData.path}</div>
                    <div class="merchant-tags">
                        ${merchantData.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
                <div class="merchant-stats">
                    <div class="stat-item">
                        <div class="stat-value">${merchantData.customerFlow}</div>
                        <div class="stat-label">客流密度</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${merchantData.rating}</div>
                        <div class="stat-label">综合评分</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${merchantData.reviews}</div>
                        <div class="stat-label">评价数</div>
                    </div>
                </div>
            `;
            document.getElementById('merchantHeader').innerHTML = html;
        }
        
        // 加载档口列表
        async function loadStalls() {
            try {
                const resp = await Router.apiCall(API_ENDPOINTS.MERCHANT_STALLS(merchantId));
                if (resp && resp.code === 200) {
                    stallsData = resp.data.map(s => ({
                        id: s.id,
                        name: s.name,
                        category: s.category || '档口',
                        status: s.is_open ? 'open' : 'closed',
                        icon: '🍽️'
                    }));
                } else {
                    stallsData = [];
                }
                renderStallList();
            } catch (error) {
                console.error('加载档口列表失败:', error);
                document.getElementById('stallList').innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }
        
        // 渲染档口列表
        function renderStallList() {
            let filteredStalls = stallsData;
            
            // 根据tab筛选
            if (currentTab === 'open') {
                filteredStalls = stallsData.filter(s => s.status === 'open');
            } else if (currentTab === 'favorite') {
                // TODO: 从localStorage获取收藏列表
                filteredStalls = [];
            }
            
            if (filteredStalls.length === 0) {
                document.getElementById('stallList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div>暂无档口</div>
                    </div>
                `;
                return;
            }
            
            const html = filteredStalls.map(stall => `
                <div class="stall-card" onclick="goToStallMenu(${stall.id})">
                    <div class="stall-icon">${stall.icon}</div>
                    <div class="stall-info">
                        <div class="stall-name">${stall.name}</div>
                        <div class="stall-category">${stall.category}</div>
                    </div>
                    <div class="stall-status ${stall.status}">
                        ${stall.status === 'open' ? '营业中' : '已打烊'}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('stallList').innerHTML = html;
        }
        
        // 切换Tab
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新Tab样式
            document.querySelectorAll('.tab').forEach(t => {
                if (t.dataset.tab === tab) {
                    t.classList.add('active');
                } else {
                    t.classList.remove('active');
                }
            });
            
            renderStallList();
        }
        
        // 跳转到档口菜单页
        function goToStallMenu(stallId) {
            Router.navigate(USER_ROUTES.getAbsoluteStallMenu(stallId));
        }
        
        // 想去试试
        function handleWantToGo() {
            alert('已添加到想去列表！');
            // TODO: 调用API保存到用户想去列表
        }
        
        // 已打卡
        function handleCheckin() {
            alert('打卡成功！');
            // TODO: 调用API记录打卡，生成社区动态
        }
        
        // 分享
        function handleShare() {
            alert('分享功能开发中...');
            // TODO: 生成分享海报
        }
        
        // 返回带认证头的对象
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }
    </script>
    
    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>校园食光 - 多校AI美食社区平台</p>
            <p>平台域名：campusfood.cn | © 2025 校园食光 版权所有</p>
            <p><a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2026006924号-1</a></p>
        </div>
    </footer>
    
    <style>
        /* 页脚样式 */
        .footer {
            background-color: white;
            padding: 20px 0;
            text-align: center;
            color: #999;
            font-size: 13px;
            border-top: 1px solid #e5e5e5;
            margin-top: 40px;
        }
        
        .footer .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
    </style>
</body>
</html>
