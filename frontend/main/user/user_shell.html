<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园食光 - 用户首页</title>
    <script src="/config.js"></script>
    <script src="/router.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            margin: 0;
        }
        
        .shell-topbar {
            background-color: #FF6B35;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .auth-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.18);
            color: #fff;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            max-width: 220px;
        }

        .user-chip-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
        }

        .user-chip-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .btn-auth {
            background-color: white;
            color: #FF6B35;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        
        .btn-auth:hover {
            background-color: #f0f0f0;
        }
        
        .shell-iframe {
            width: 100%;
            height: calc(100vh - 52px);
            border: none;
        }
        
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-modal.active {
            display: flex;
        }
        
        /* 登录卡片样式 */
        .login-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.2);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 0;
            text-align: center;
            position: relative;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            z-index: 100;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        /* 标签页导航 */
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        .modal-tab {
            flex: 1;
            padding: 12px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        
        .modal-tab.active {
            background: white;
            color: #FF6B35;
            border-bottom-color: #FF6B35;
        }
        
        /* 标签页内容 */
        .modal-tab-content {
            display: none;
            padding: 30px 30px;
            text-align: center;
            max-height: calc(90vh - 52px);
            overflow-y: auto;
        }
        
        .modal-tab-content.active {
            display: block;
        }
        
        /* 公共表单样式 */
        .logo {
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            border-color: #FF6B35;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }
        
        .form-control:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }
        
        .extra-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
        }
        
        .remember-me input {
            margin-right: 5px;
        }
        
        .forgot-password a {
            color: #FF6B35;
            text-decoration: none;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: #FF6B35;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #e55a2a;
        }
        
        .btn-admin-primary {
            background-color: #1890FF;
            color: white;
        }
        
        .btn-admin-primary:hover {
            background-color: #0c7cd5;
        }
        
        .bottom-link {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
        
        .bottom-link a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        .admin-tag {
            display: inline-block;
            background-color: #1890FF;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        /* 学校搜索联想框样式优化 */
        #regSchoolSuggest::-webkit-scrollbar {
            width: 6px;
        }
        #regSchoolSuggest::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }
        #regSchoolSuggest::-webkit-scrollbar-thumb:hover {
            background: #FF6B35;
        }
        .school-item {
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .school-item:hover {
            background-color: #fff5eb;
            color: #FF6B35;
        }
        
        @media (max-width: 480px) {
            .login-container {
                max-width: 100%;
            }
            .modal-tab-content {
                padding: 20px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="shell-topbar">
        <div class="brand">
            <span>🍽️</span>
            <span>校园食光</span>
        </div>
        <div class="auth-buttons" id="authButtons">
            <button class="btn-auth" onclick="showLoginModal('user')">登录</button>
            <button class="btn-auth" onclick="showLoginModal('register')">注册</button>
        </div>
    </div>

    <!-- 主要内容 iframe -->
    <iframe id="contentFrame" class="shell-iframe" src="/main/user/user_index.html"></iframe>

    <!-- 统一登录弹窗（所有标签页） -->
    <div class="login-modal" id="loginModal">
        <div class="login-container">
            <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            
            <!-- 标签页导航 -->
            <div class="modal-tabs">
                <button class="modal-tab active" onclick="switchTab('user')">用户登入</button>
                <button class="modal-tab" onclick="switchTab('register')">注册账号</button>
                <button class="modal-tab" onclick="switchTab('admin')">管理员登入</button>
            </div>
            
            <!-- 用户登入标签页 -->
            <div class="modal-tab-content active" id="tab-user">
                <div class="logo" style="color: #FF6B35;">🍽️</div>
                <h1 class="title">校园食光</h1>
                <p class="subtitle">发现校园里的每一处美食</p>
                
                <form id="userLoginForm">
                    <div class="form-group">
                        <label for="userLoginUsername">用户名</label>
                        <input type="text" id="userLoginUsername" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="userLoginPassword">密码</label>
                        <input type="password" id="userLoginPassword" class="form-control" placeholder="请输入密码" required>
                    </div>
                    
                    <div class="extra-options">
                        <div class="remember-me">
                            <input type="checkbox" id="userRemember">
                            <label for="userRemember">记住我</label>
                        </div>
                        <div class="forgot-password">
                            <a href="#">忘记密码?</a>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">登录</button>
                </form>
            </div>
            
            <!-- 注册标签页 -->
            <div class="modal-tab-content" id="tab-register">
                <div class="logo" style="color: #FF6B35;">🍽️</div>
                <h1 class="title">校园食光</h1>
                <p class="subtitle">发现校园里的每一处美食</p>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="请输入密码(至少6位)" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regConfirmPassword">确认密码</label>
                        <input type="password" id="regConfirmPassword" class="form-control" placeholder="请再次输入密码" required>
                    </div>

                    <div class="form-group" style="position: relative;">
                        <label for="regSchoolInput">学校</label>
                        <input type="text" id="regSchoolInput" class="form-control" placeholder="输入学校名称筛选" required>
                        <div id="regSchoolSuggest" style="position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; box-shadow: 0 3px 10px rgba(255,107,53,0.1); z-index: 999; max-height: 250px; overflow-y: auto; display: block;">
                            <div style="padding: 10px; color: #999; text-align: center;">加载中... 请稍候</div>
                        </div>
                        <input type="hidden" id="regSchool" name="school" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regRealName">真实姓名</label>
                        <input type="text" id="regRealName" class="form-control" placeholder="请输入真实姓名" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regStudentId">学号</label>
                        <input type="text" id="regStudentId" class="form-control" placeholder="请输入学号" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regCollege">学院</label>
                        <select id="regCollege" class="form-control" required disabled>
                            <option value="">请先选择学校</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="regMajor">专业</label>
                        <input type="text" id="regMajor" class="form-control" placeholder="请输入专业" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regGrade">年级</label>
                        <select id="regGrade" class="form-control" required>
                            <option value="">请选择年级</option>
                            <option value="大一">大一</option>
                            <option value="大二">大二</option>
                            <option value="大三">大三</option>
                            <option value="大四">大四</option>
                            <option value="研一">研一</option>
                            <option value="研二">研二</option>
                            <option value="研三">研三</option>
                            <option value="博一">博一</option>
                            <option value="博二">博二</option>
                            <option value="博三">博三</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPhone">手机号</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="请输入手机号" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">立即注册</button>
                </form>
                
                <div class="bottom-link">
                    已有账号？<a onclick="switchTab('user')">立即登录</a>
                </div>
            </div>
            
            <!-- 管理员登入标签页 -->
            <div class="modal-tab-content" id="tab-admin">
                <div class="logo" style="color: #1890FF;">🔐</div>
                <h1 class="title">管理员登录</h1>
                <div class="admin-tag">仅供管理员使用</div>
                <p class="subtitle">食堂/商户/学校管理平台</p>
                
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminUsername">用户名</label>
                        <input type="text" id="adminUsername" class="form-control" placeholder="请输入管理员用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="adminPassword">密码</label>
                        <input type="password" id="adminPassword" class="form-control" placeholder="请输入密码" required>
                    </div>
                    
                    <button type="submit" class="btn btn-admin-primary">登录</button>
                </form>
                
                <div class="bottom-link">
                    返回用户登入？<a onclick="switchTab('user')">点此返回</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 标签页切换
        function switchTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.modal-tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.modal-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示选中的标签页
            document.getElementById('tab-' + tabName).classList.add('active');
            
            // 找到对应的按钮并标记为 active
            const buttons = document.querySelectorAll('.modal-tab');
            const tabNames = ['user', 'register', 'admin'];
            buttons.forEach((btn, index) => {
                if (tabNames[index] === tabName) {
                    btn.classList.add('active');
                }
            });
        }
        
        // 显示登录弹窗并切换到指定标签页
        function showLoginModal(tabName) {
            switchTab(tabName);
            document.getElementById('loginModal').classList.add('active');
        }
        
        // 关闭登录弹窗
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }
        
        const DEFAULT_AVATAR = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2232%22 fill=%22%23f2f3f5%22/%3E%3Ccircle cx=%2232%22 cy=%2225%22 r=%2212%22 fill=%22%239aa1ab%22/%3E%3Cpath d=%22M14 54c2.6-9.4 10.2-14 18-14s15.4 4.6 18 14%22 fill=%22%239aa1ab%22/%3E%3C/svg%3E';

        // 将头像地址规范化为可直接加载的URL（兼容相对路径）
        function normalizeAvatarUrl(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string') {
                return DEFAULT_AVATAR;
            }

            const url = rawUrl.trim().replace(/\\/g, '/');
            if (!url) {
                return DEFAULT_AVATAR;
            }

            if (/^(https?:|data:|blob:)/i.test(url)) {
                return url;
            }

            if (url.startsWith('//')) {
                return `${window.location.protocol}${url}`;
            }

            if (url.startsWith('/')) {
                return `${CONFIG.getBaseUrl()}${url}`;
            }

            return `${CONFIG.getBaseUrl()}/${url.replace(/^\.?\//, '')}`;
        }

        // 与个人中心同源：主动拉取一次用户资料，补齐头像等字段到本地缓存
        async function syncUserProfileForNavbar() {
            const token = localStorage.getItem(STORAGE_KEYS.ACCESS_TOKEN);
            if (!token) return;

            try {
                const resp = await Router.apiCall(API_ENDPOINTS.USER_PROFILE, { method: 'GET' });
                if (resp && resp.code === 200 && resp.data) {
                    const profile = resp.data;
                    if (profile.avatar) {
                        localStorage.setItem(STORAGE_KEYS.AVATAR, profile.avatar);
                    }
                    if (profile.realName) {
                        localStorage.setItem(STORAGE_KEYS.REAL_NAME, profile.realName);
                    }
                    if (profile.username) {
                        localStorage.setItem(STORAGE_KEYS.USERNAME, profile.username);
                    }
                    checkLoginStatus();
                }
            } catch (error) {
                console.warn('同步用户资料失败（不影响页面继续使用）:', error.message || error);
            }
        }

        // 检查登录状态
        function checkLoginStatus() {
            const token = localStorage.getItem(STORAGE_KEYS.ACCESS_TOKEN);
            const authButtons = document.getElementById('authButtons');
            const currentUser = (typeof Router !== 'undefined' && typeof Router.getCurrentUser === 'function')
                ? Router.getCurrentUser()
                : null;

            const rawAvatar = (currentUser && currentUser.avatar)
                || localStorage.getItem(STORAGE_KEYS.AVATAR)
                || localStorage.getItem('avatar')
                || '';
            const avatar = normalizeAvatarUrl(rawAvatar);
            
            if (token) {
                const username = (currentUser && (currentUser.realName || currentUser.username))
                    || localStorage.getItem(STORAGE_KEYS.USERNAME)
                    || localStorage.getItem('username')
                    || '用户';
                authButtons.innerHTML = `
                    <div class="user-chip" title="${username}">
                        <img class="user-chip-avatar" src="${avatar}" alt="avatar" onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}';" />
                        <span class="user-chip-name">${username}</span>
                    </div>
                    <button class="btn-auth" onclick="handleLogout()">登出</button>
                `;
            } else {
                authButtons.innerHTML = `
                    <button class="btn-auth" onclick="showLoginModal('user')">登录</button>
                    <button class="btn-auth" onclick="showLoginModal('register')">注册</button>
                `;
            }
        }
        
        // 登出
        function handleLogout() {
            localStorage.removeItem(STORAGE_KEYS.ACCESS_TOKEN);
            localStorage.removeItem(STORAGE_KEYS.REFRESH_TOKEN);
            localStorage.removeItem(STORAGE_KEYS.USER_ROLE);
            localStorage.removeItem(STORAGE_KEYS.USER_ID);
            localStorage.removeItem(STORAGE_KEYS.USERNAME);
            localStorage.removeItem(STORAGE_KEYS.AVATAR);

            // 退出后强制跳到独立首页（非 shell），避免 iframe 场景导致导航重复和脚本报错
            const homeUrl = (USER_ROUTES && typeof USER_ROUTES.getAbsoluteIndex === 'function')
                ? USER_ROUTES.getAbsoluteIndex()
                : `${CONFIG.getBaseUrl()}/main/user/user_index.html`;

            closeLoginModal();
            checkLoginStatus();
            window.location.replace(homeUrl);
        }
        
        // 用户登入表单处理
        document.getElementById('userLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('userLoginUsername').value;
            const password = document.getElementById('userLoginPassword').value;
            
            if (password.length < 6) {
                alert('密码至少需要6位字符！');
                return;
            }
            
            try {
                const data = await Router.apiCall(API_ENDPOINTS.LOGIN, {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                
                if (data && data.code === 200) {
                    Router.saveUserData(data.data);
                    alert('登录成功！');
                    closeLoginModal();
                    checkLoginStatus();
                    await syncUserProfileForNavbar();
                    document.getElementById('userLoginForm').reset();
                    // 刷新iframe内容
                    document.getElementById('contentFrame').contentWindow.location.reload();
                } else {
                    alert((data && data.message) || '登录失败');
                }
            } catch (error) {
                console.error('登录错误:', error);
                alert('登录失败，请检查网络连接');
            }
        });
        
        // 注册表单处理
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const selectedSchool = document.getElementById('regSchool').value;
            const selectedCollege = document.getElementById('regCollege').value;
            
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致！');
                return;
            }
            if (password.length < 6) {
                alert('密码至少需要6位字符！');
                return;
            }
            if (!selectedSchool) {
                alert('请从列表中选择您的学校！');
                return;
            }
            if (!selectedCollege) {
                alert('请选择您的学院！');
                return;
            }

            const registerData = {
                username,
                password,
                school: selectedSchool,
                realName: document.getElementById('regRealName').value,
                studentId: document.getElementById('regStudentId').value,
                college: selectedCollege,
                major: document.getElementById('regMajor').value,
                grade: document.getElementById('regGrade').value,
                phone: document.getElementById('regPhone').value
            };
            
            try {
                const data = await Router.apiCall(API_ENDPOINTS.REGISTER, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData)
                });
                
                if (data && (data.code === 200 || data.message && data.message.includes('成功'))) {
                    alert('注册成功！请登入');
                    switchTab('user');
                } else {
                    alert('注册失败：' + ((data && data.message) || '未知错误'));
                }
            } catch (error) {
                console.error('注册请求失败:', error);
                alert('注册失败，请检查网络连接或稍后重试');
            }
        });
        
        // 管理员登入表单处理
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            try {
                const data = await Router.apiCall(API_ENDPOINTS.ADMIN_LOGIN, {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                
                if (data && data.code === 200) {
                    const { token, adminId, positions, adminInfo } = data.data;
                    
                    localStorage.setItem('adminToken', token);
                    localStorage.setItem('adminId', adminId);
                    localStorage.setItem('adminInfo', JSON.stringify(adminInfo));
                    localStorage.setItem('adminPositions', JSON.stringify(positions));
                    localStorage.setItem('username', adminInfo.username);
                    localStorage.setItem('userName', adminInfo.username);

                    if (positions.length >= 1) {
                        if (positions.length === 1) {
                            localStorage.setItem('adminActivePositionId', positions[0].id);
                        }
                        const shellUrl = (ADMIN_ROUTES && typeof ADMIN_ROUTES.getAbsoluteAdminShell === 'function')
                            ? ADMIN_ROUTES.getAbsoluteAdminShell()
                            : `${CONFIG.getBaseUrl()}/main/admin/admin_shell.html`;
                        window.location.href = shellUrl;
                    } else {
                        alert('该账号暂无分配职位，请联系上级管理员');
                    }
                } else {
                    alert('登入失败：' + (data.message || '账号或密码错误'));
                }
            } catch (error) {
                console.error('管理员登入错误:', error);
                alert('登入失败，请检查网络连接或稍后重试');
            }
        });
        
        // 初始化登录状态
        checkLoginStatus();
        syncUserProfileForNavbar();

        // 从 iframe（例如个人中心）收到头像更新通知后，立即刷新顶栏
        window.addEventListener('message', function(event) {
            if (event && event.data && event.data.type === 'avatar-updated') {
                checkLoginStatus();
                syncUserProfileForNavbar();
            }
        });

        // 页面重新获得焦点时再同步一次，避免同页更新 localStorage 无事件触发
        window.addEventListener('focus', function() {
            syncUserProfileForNavbar();
        });
        
        // 监听iframe的消息（来自user_index内部的登录请求）
        //window.addEventListener('message', function(event) {
            //if (event.data.type === 'openLoginModal') {
               // showLoginModal(event.data.tab || 'user');
            //}
        //});

        // ======================================
        // 学校-学院映射表（从 register.html 复制）
        // ======================================
        const SCHOOL_COLLEGE_OFFICIAL = {
            "深圳技术大学": ["计算机科学与技术学院", "电信工程与智能化学院", "生态环境与建筑工程学院", "马克思主义学院", "研究生院", "卓越工程师学院", "经管学院", "外国语学院", "教育学院"],
            "深圳大学": ["计算机与软件学院", "电子与信息工程学院", "建筑与城市规划学院", "经济学院", "管理学院", "外国语学院", "法学院", "马克思主义学院"],
            "华南理工大学": ["计算机科学与工程学院", "电子与信息学院", "土木与交通学院", "工商管理学院", "经济与金融学院", "外国语学院"],
            "广东工业大学": ["计算机学院", "电子信息学院", "建筑与环境学院", "管理学院", "经济学院", "马克思主义学院"],
            "北京大学": ["信息科学技术学院", "经济学院", "光华管理学院", "外国语学院", "法学院", "马克思主义学院"],
            "清华大学": ["计算机系", "电子工程系", "建筑学院", "经济管理学院", "人文学院", "外国语学院"],
            "中山大学": ["计算机学院", "电子与信息工程学院", "建筑学院", "岭南学院", "管理学院", "外国语学院"],
            "哈尔滨工业大学（深圳）": ["计算机科学与技术学院", "电子与信息工程学院", "土木与环境工程学院", "经济管理学院"],
            "东莞理工学院": ["计算机科学与技术学院", "电信工程与智能化学院", "生态环境与建筑工程学院", "马克思主义学院", "研究生院","卓越工程师学院","经管学院","外国语学院","教育学院"]
        };

        // ======================================
        // 全局DOM变量
        // ======================================
        const regSchoolInput = document.getElementById('regSchoolInput');
        const regSchoolSuggest = document.getElementById('regSchoolSuggest');
        const regSchoolHidden = document.getElementById('regSchool');
        const regCollegeSelect = document.getElementById('regCollege');
        let allSchools = [];

        // ======================================
        // 加载全量学校数据源
        // ======================================
        async function loadAllSchools() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/chenjiandongx/university-list/master/universities.json');
                if (!res.ok) throw new Error('数据源请求失败');
                const data = await res.json();
                allSchools = [...new Set(data.map(school => school.name))]
                    .sort((a, b) => a.localeCompare(b, 'zh-CN'));
                renderSchoolList(allSchools);
            } catch (err) {
                console.error('学校数据源加载失败:', err);
                const fallbackSchools = [
                    "北京大学", "清华大学", "浙江大学", "上海交通大学", "复旦大学",
                    "南京大学", "中国科学技术大学", "哈尔滨工业大学", "西安交通大学", "中山大学",
                    "武汉大学", "华中科技大学", "东南大学", "南开大学", "天津大学",
                    "四川大学", "吉林大学", "山东大学", "厦门大学", "北京航空航天大学",
                    "北京理工大学", "同济大学", "华南理工大学", "大连理工大学", "西北工业大学",
                    "重庆大学", "电子科技大学", "兰州大学", "华南师范大学", "深圳技术大学",
                    "深圳大学", "南方科技大学", "哈尔滨工业大学（深圳）", "暨南大学", "广东工业大学",
                    "广州大学", "华南农业大学", "广东外语外贸大学", "汕头大学", "广州医科大学",
                    "广东药科大学", "东莞理工学院", "佛山科学技术学院", "韶关学院", "惠州学院"
                ];
                allSchools = fallbackSchools.sort((a, b) => a.localeCompare(b, 'zh-CN'));
                renderSchoolList(allSchools);
            }
        }

        function renderSchoolList(schools) {
            if (schools.length === 0) {
                regSchoolSuggest.innerHTML = '<div style="padding: 10px; color: #777; text-align: center;">暂无匹配学校</div>';
                return;
            }
            regSchoolSuggest.innerHTML = schools.map(school => 
                `<div class="school-item">${school}</div>`
            ).join('');
            bindSchoolSelectEvent();
        }

        function bindSchoolSelectEvent() {
            regSchoolSuggest.querySelectorAll('.school-item').forEach(item => {
                item.addEventListener('click', function() {
                    const selectedSchool = this.textContent;
                    regSchoolInput.value = selectedSchool;
                    regSchoolHidden.value = selectedSchool;
                    regSchoolSuggest.style.display = 'block';
                    loadCollegeBySchool(selectedSchool);
                });
            });
        }

        function loadCollegeBySchool(schoolName) {
            regCollegeSelect.innerHTML = '<option value="">请选择学院</option>';
            regCollegeSelect.disabled = false;
            const colleges = SCHOOL_COLLEGE_OFFICIAL[schoolName] || [];
            if (colleges.length === 0) {
                regCollegeSelect.innerHTML = '<option value="">该学校暂无官方学院数据</option>';
                return;
            }
            colleges.forEach(college => {
                const opt = document.createElement('option');
                opt.value = college;
                opt.textContent = college;
                regCollegeSelect.appendChild(opt);
            });
        }

        regSchoolInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (keyword === '') {
                renderSchoolList(allSchools);
                regCollegeSelect.innerHTML = '<option value="">请先选择学校</option>';
                regCollegeSelect.disabled = true;
                regSchoolHidden.value = '';
                return;
            }
            const filteredSchools = allSchools.filter(school => 
                school.toLowerCase().includes(keyword)
            );
            renderSchoolList(filteredSchools);
        });

        document.addEventListener('click', function(e) {
            if (!regSchoolInput.contains(e.target) && !regSchoolSuggest.contains(e.target)) {
                regSchoolSuggest.style.display = 'none';
            } else if (regSchoolInput.contains(e.target)) {
                regSchoolSuggest.style.display = 'block';
            }
        });

        // 初始化加载学校列表
        loadAllSchools();
    </script>
</body>
</html>
